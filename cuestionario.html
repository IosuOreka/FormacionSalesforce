<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce developer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 90%;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .question {
      font-size: 1.2em;
      margin-bottom: 15px;
    }
    .answer {
      margin: 10px 0;
      padding: 10px;
      background-color: #f1f1f1;
      cursor: pointer;
    }
    .answer:hover {
      background-color: #e0e0e0;
    }
    .feedback {
      margin-top: 20px;
      font-size: 1.1em;
      color: #333;
    }
    .correct {
      color: green;
    }
    .incorrect {
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Salesforce developer</h1>
    <div id="question-container"></div>
    <div class="feedback" id="feedback"></div>
    <button id="validate-btn" style="display: none;">Validar</button>
    <button id="next-btn" style="display: none;">Siguiente</button>
  </div>

  <script>
    const questions = [
    {
      "question": "24- Given the following Anonymous block:",
      "tipo": "única",
      "options": [
        "a) The transaction will succeed and changes will be committed.",
        "b) The try-catch block will handle exceptions thrown by governor limits.",
        "c) The transaction will fail due to exceeding the governor limit.",
        "d) The try-catch block will handle any DML exceptions thrown."
      ],
      "correctAnswer": [2],
      "image": "public/24.png"
    },

  ];

    let currentQuestionIndex = 0;
    let score = 0;

    function shuffleQuestions() {
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }
    }

    function showQuestion(questionIndex) {
      const question = questions[questionIndex];
      const container = document.getElementById('question-container');
      const feedback = document.getElementById('feedback');
      const validateBtn = document.getElementById('validate-btn');
      const nextBtn = document.getElementById('next-btn');
      
      feedback.innerHTML = '';
      validateBtn.style.display = 'block';
      nextBtn.style.display = 'none';

      container.innerHTML = `
        <div class="question">${question.question}</div>
        ${question.image ? `<img src="${question.image}" alt="Question Image" style="max-width: 100%; margin-bottom: 15px;">` : ''}
        <div class="options">
          ${question.options.map((option, index) => 
            `<label><input type="checkbox" class="answer" data-index="${index}"> ${option}</label><br>`
          ).join('')}
        </div>
      `;

      validateBtn.onclick = () => {
        if (question.tipo === "múltiple") {
          checkMultipleAnswer(question.correctAnswer);
        } else {
          checkSingleAnswer(question.correctAnswer);
        }
      };
    }

    function checkSingleAnswer(correctIndex) {
      const feedback = document.getElementById('feedback');
      const selectedAnswers = Array.from(document.querySelectorAll('.answer:checked')).map(answer => parseInt(answer.dataset.index));
      if (selectedAnswers.length === 1 && selectedAnswers[0] === correctIndex[0]) {
        score++;
        feedback.innerHTML = `<p class="correct">¡Correcto! La respuesta es: ${questions[currentQuestionIndex].options[correctIndex[0]]}</p>`;
      } else {
        feedback.innerHTML = `<p class="incorrect">Incorrecto. La respuesta correcta es: ${questions[currentQuestionIndex].options[correctIndex[0]]}</p>`;
      }
      document.getElementById('next-btn').style.display = 'block';
    }

    function checkMultipleAnswer(correctIndexes) {
      const feedback = document.getElementById('feedback');
      const selectedAnswers = Array.from(document.querySelectorAll('.answer:checked')).map(answer => parseInt(answer.dataset.index));
      if (arraysEqual(selectedAnswers, correctIndexes)) {
        score++;
        feedback.innerHTML = `<p class="correct">¡Correcto! Las respuestas son: ${correctIndexes.map(index => questions[currentQuestionIndex].options[index]).join(', ')}</p>`;
      } else {
        feedback.innerHTML = `<p class="incorrect">Incorrecto. Las respuestas correctas son: ${correctIndexes.map(index => questions[currentQuestionIndex].options[index]).join(', ')}</p>`;
      }
      document.getElementById('next-btn').style.display = 'block';
    }

    function arraysEqual(arr1, arr2) {
      if (arr1.length !== arr2.length) return false;
      arr1.sort();
      arr2.sort();
      for (let i = 0; i < arr1.length; i++) {
        if (arr1[i] !== arr2[i]) return false;
      }
      return true;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion(currentQuestionIndex);
      } else {
        const container = document.getElementById('question-container');
        container.innerHTML = `<h2>¡Encuesta completada!</h2><p>Tu puntaje es: ${score} de ${questions.length}</p>`;
        document.getElementById('next-btn').style.display = 'none';
      }
    }

    function startSurvey() {
      //shuffleQuestions();
      showQuestion(currentQuestionIndex);
    }

    window.onload = startSurvey;

    document.getElementById('next-btn').addEventListener('click', nextQuestion);
  </script>

</body>
</html>
